[project]
name = "ipmonitor"
version = "1.0.0"
description = "Monitor profesional de paquetes IP en tiempo real con geolocalización por país y dashboard TUI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "networkmonitoring" }]
keywords = ["network", "packets", "monitor", "geoip", "scapy", "tui", "rich"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.5.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "tomli>=2.0.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
geoip = ["geoip2>=4.8.0"]
dev = ["pytest>=7"]

[project.scripts]
ipmonitor = "ipmonitor.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ipmonitor*"]
